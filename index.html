<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Barcode Scanner - E-Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 40px;
    }
    .header { text-align: center; margin-bottom: 20px; max-width: 480px; }
    .header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: #94a3b8; }
    .badge {
        display: inline-block;
        background: #059669;
        color: white;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        margin-bottom: 10px;
        letter-spacing: 0.05em;
    }
    .camera-select {
        width: 100%;
        max-width: 480px;
        margin-bottom: 14px;
    }
    select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        font-size: 0.9rem;
    }
    .video-wrap {
        position: relative;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 4 / 3;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        border: 2px solid #334155;
        margin-bottom: 16px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-line {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 50%;
        height: 2px;
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
        animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
        0%, 100% { top: 20%; }
        50% { top: 80%; }
    }
    .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #64748b;
        gap: 8px;
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.5; }
    button {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        border-radius: 14px;
        transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    .btn-main {
        width: 100%;
        max-width: 480px;
        padding: 14px;
        font-size: 0.95rem;
        background: #4f46e5;
        color: white;
        margin-bottom: 20px;
    }
    .btn-main.stop { background: #dc2626; }
    .btn-main:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status-box {
        width: 100%;
        max-width: 480px;
        padding: 14px 16px;
        border-radius: 14px;
        margin-bottom: 20px;
        font-size: 0.85rem;
        display: none;
    }
    .status-box.show { display: block; }
    .status-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .status-success { background: #052e16; border: 1px solid #14532d; color: #86efac; }
    .status-info { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
    .divider {
        width: 100%;
        max-width: 480px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 18px;
        color: #475569;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #334155;
    }
    .manual-box {
        width: 100%;
        max-width: 480px;
        display: flex;
        gap: 8px;
    }
    .manual-box input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        font-size: 0.9rem;
    }
    .manual-box input:focus { outline: 2px solid #4f46e5; }
    .manual-box button {
        padding: 12px 18px;
        background: #1e293b;
        border: 1px solid #334155;
        color: #f1f5f9;
        font-size: 0.9rem;
        white-space: nowrap;
    }
    .footer-note {
        margin-top: 24px;
        font-size: 0.75rem;
        color: #475569;
        text-align: center;
        max-width: 480px;
    }
</style>
</head>
<body>

<div class="header">
    <span class="badge">🔒 HTTPS SECURE</span>
    <h1>Live Barcode Scanner</h1>
    <p>Arahkan kamera ke barcode sparepart. Hasil akan otomatis dikirim kembali ke sistem e-Catalog.</p>
</div>

<div class="camera-select">
    <select id="cameraSelect"></select>
</div>

<div class="video-wrap">
    <video id="video" playsinline muted></video>
    <div class="scan-line" id="scanLine" style="display:none;"></div>
    <div class="placeholder" id="placeholder">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9V6a2 2 0 012-2h2M3 15v3a2 2 0 002 2h2m10-16h2a2 2 0 012 2v3m0 6v3a2 2 0 01-2 2h-2M8 12h8"></path></svg>
        <span>Kamera belum aktif</span>
    </div>
</div>

<button class="btn-main" id="toggleBtn">Mulai Kamera</button>

<div class="status-box" id="statusBox"></div>

<div class="divider">Atau</div>

<div class="manual-box">
    <input type="text" id="manualInput" placeholder="Masukkan kode barcode manual...">
    <button id="manualBtn">Kirim</button>
</div>

<p class="footer-note" id="returnInfo"></p>

<script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get('returnUrl');

    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggleBtn');
    const cameraSelect = document.getElementById('cameraSelect');
    const placeholder = document.getElementById('placeholder');
    const scanLine = document.getElementById('scanLine');
    const statusBox = document.getElementById('statusBox');
    const manualInput = document.getElementById('manualInput');
    const manualBtn = document.getElementById('manualBtn');
    const returnInfo = document.getElementById('returnInfo');

    let codeReader = null;
    let isScanning = false;
    let selectedDeviceId = null;

    function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = 'status-box show status-' + type;
    }

    function hideStatus() {
        statusBox.className = 'status-box';
    }

    // Validasi returnUrl wajib ada
    if (!returnUrl) {
        showStatus('URL kembali (returnUrl) tidak ditemukan di parameter. Buka halaman ini melalui tombol "Live Scanner" di web e-Catalog, jangan diakses langsung.', 'error');
        toggleBtn.disabled = true;
        manualBtn.disabled = true;
    } else {
        try {
            const u = new URL(returnUrl);
            returnInfo.textContent = 'Hasil scan akan dikirim ke: ' + u.hostname;
        } catch (e) {
            returnInfo.textContent = '';
        }
    }

    function sendResult(barcodeValue) {
        if (!returnUrl) return;
        const separator = returnUrl.includes('?') ? '&' : '?';
        const finalUrl = returnUrl + separator + 'barcode=' + encodeURIComponent(barcodeValue);
        showStatus('Barcode terbaca: ' + barcodeValue + ' — mengarahkan kembali...', 'success');
        setTimeout(() => { window.location.href = finalUrl; }, 700);
    }

    async function populateCameras() {
        try {
            const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
            cameraSelect.innerHTML = '';
            devices.forEach((device, idx) => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.textContent = device.label || ('Kamera ' + (idx + 1));
                cameraSelect.appendChild(opt);
            });
            // Prioritaskan kamera belakang jika labelnya mengandung "back"
            const backCam = devices.find(d => /back|belakang|environment/i.test(d.label));
            selectedDeviceId = backCam ? backCam.deviceId : (devices[0] ? devices[0].deviceId : null);
            if (selectedDeviceId) cameraSelect.value = selectedDeviceId;
        } catch (e) {
            showStatus('Tidak bisa mengambil daftar kamera: ' + e.message, 'error');
        }
    }

    cameraSelect.addEventListener('change', () => {
        selectedDeviceId = cameraSelect.value;
        if (isScanning) {
            stopScanning();
            startScanning();
        }
    });

    async function startScanning() {
        if (!returnUrl) return;
        hideStatus();
        placeholder.style.display = 'none';
        scanLine.style.display = 'block';
        toggleBtn.textContent = 'Hentikan Kamera';
        toggleBtn.classList.add('stop');
        isScanning = true;

        const hints = new Map();
const formats = [
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.CODE_93,
    ZXing.BarcodeFormat.ITF,
    ZXing.BarcodeFormat.CODABAR,
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,
];
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
codeReader = new ZXing.BrowserMultiFormatReader(hints);
        try {
            await codeReader.decodeFromVideoDevice(selectedDeviceId, video, (result, err) => {
                if (result) {
                    sendResult(result.getText());
                    stopScanning();
                }
            });
        } catch (e) {
            if (e && e.name === 'NotAllowedError') {
                showStatus('Izin kamera ditolak. Pastikan browser diberi izin akses kamera untuk situs ini.', 'error');
            } else {
                showStatus('Gagal mengakses kamera: ' + (e.message || e), 'error');
            }
            stopScanning();
        }
    }

    function stopScanning() {
        if (codeReader) {
            try { codeReader.reset(); } catch (e) {}
            codeReader = null;
        }
        isScanning = false;
        placeholder.style.display = 'flex';
        scanLine.style.display = 'none';
        toggleBtn.textContent = 'Mulai Kamera';
        toggleBtn.classList.remove('stop');
    }

    toggleBtn.addEventListener('click', () => {
        if (isScanning) {
            stopScanning();
        } else {
            startScanning();
        }
    });

    manualBtn.addEventListener('click', () => {
        const val = manualInput.value.trim();
        if (!val) return;
        sendResult(val);
    });

    manualInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') manualBtn.click();
    });

    // Init: minta izin kamera dulu supaya label device muncul, lalu populate list
    (async function init() {
        if (!returnUrl) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
        } catch (e) {
            // biarkan saja, nanti error ditangani saat startScanning
        }
        await populateCameras();
    })();
</script>

</body>
</html>
