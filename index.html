<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Barcode Scanner - E-Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.2/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0e14;
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .top-bar {
        width: 100%;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 480px;
    }
    .top-bar h1 { font-size: 1rem; font-weight: 600; }
    .top-bar .status-text { font-size: 0.72rem; color: #6b7280; margin-top: 2px; }
    .torch-btn {
        background: #1f2430;
        border: 1px solid #2d3341;
        color: #e5e7eb;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .torch-btn.on { background: #4f46e5; border-color: #4f46e5; }
    .torch-btn svg { width: 18px; height: 18px; }
    .torch-btn[disabled] { opacity: 0.3; cursor: not-allowed; }

    .video-wrap {
        position: relative;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 3 / 4;
        background: #000;
        overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #4b5563;
        gap: 8px;
    }
    .placeholder svg { width: 44px; height: 44px; opacity: 0.5; }
    .placeholder span { font-size: 0.85rem; }

    .focus-ring {
        position: absolute;
        width: 64px;
        height: 64px;
        border: 2px solid #fbbf24;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0;
        pointer-events: none;
    }
    .focus-ring.show {
        animation: focusPulse 0.6s ease-out;
    }
    @keyframes focusPulse {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }

    .ocr-hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: #9ca3af;
        font-size: 0.68rem;
        padding: 4px 10px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .ocr-hint.show { opacity: 1; }

    .content {
        width: 100%;
        max-width: 480px;
        padding: 16px;
    }
    button {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        border-radius: 12px;
        transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    .btn-main {
        width: 100%;
        padding: 13px;
        font-size: 0.9rem;
        background: #4f46e5;
        color: white;
        margin-bottom: 14px;
    }
    .btn-main.stop { background: #dc2626; }
    .btn-main:disabled { background: #262b36; color: #4b5563; cursor: not-allowed; }
    .status-box {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 14px;
        font-size: 0.82rem;
        display: none;
    }
    .status-box.show { display: block; }
    .status-error { background: #2a0f10; border: 1px solid #5c1a1c; color: #fca5a5; }
    .status-success { background: #0c2318; border: 1px solid #14532d; color: #86efac; }
    .status-info { background: #1a1f2b; border: 1px solid #2d3341; color: #9ca3af; }
    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 14px;
        color: #4b5563;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2d3341; }
    .manual-box { display: flex; gap: 8px; }
    .manual-box input {
        flex: 1;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1px solid #2d3341;
        background: #1a1f2b;
        color: #e5e7eb;
        font-size: 0.85rem;
    }
    .manual-box input:focus { outline: 2px solid #4f46e5; }
    .manual-box button {
        padding: 11px 16px;
        background: #1a1f2b;
        border: 1px solid #2d3341;
        color: #e5e7eb;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    .target-box {
        margin-top: 14px;
        padding: 11px 13px;
        background: #1a1f2b;
        border: 1px solid #2d3341;
        border-radius: 12px;
        cursor: pointer;
    }
    .target-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: #4b5563; margin-bottom: 4px; }
    .target-display { font-size: 0.75rem; color: #9ca3af; word-break: break-all; font-family: monospace; }
    .target-input {
        width: 100%;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid #4f46e5;
        background: #0b0e14;
        color: #e5e7eb;
        font-size: 0.75rem;
        font-family: monospace;
    }
    .target-actions { display: flex; gap: 8px; margin-top: 8px; }
    .target-actions button { padding: 6px 12px; font-size: 0.7rem; border-radius: 8px; }
    #targetSave { background: #4f46e5; color: white; }
    #targetCancel { background: #262b36; color: #9ca3af; }
</style>
</head>
<body>

<div class="top-bar">
    <div>
        <h1>Barcode Scanner</h1>
        <div class="status-text" id="statusText">Kamera belum aktif</div>
    </div>
    <button class="torch-btn" id="torchBtn" disabled title="Senter">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </button>
</div>

<div class="video-wrap" id="videoWrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="placeholder" id="placeholder">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9V6a2 2 0 012-2h2M3 15v3a2 2 0 002 2h2m10-16h2a2 2 0 012 2v3m0 6v3a2 2 0 01-2 2h-2M8 12h8"></path></svg>
        <span>Kamera belum aktif</span>
    </div>
    <div class="focus-ring" id="focusRing"></div>
    <div class="ocr-hint" id="ocrHint">Mencoba membaca teks...</div>
</div>

<div class="content">
    <button class="btn-main" id="toggleBtn" style="margin-top:16px;">Mulai Kamera</button>

    <div class="status-box" id="statusBox"></div>

    <div class="divider">Atau</div>

    <div class="manual-box">
        <input type="text" id="manualInput" placeholder="Masukkan kode barcode/part manual...">
        <button id="manualBtn">Kirim</button>
    </div>

    <div class="target-box" id="targetBox">
        <div class="target-label">Hasil akan dikirim ke</div>
        <div class="target-display" id="targetDisplay"></div>
        <input type="text" class="target-input" id="targetInput" style="display:none;">
        <div class="target-actions" id="targetActions" style="display:none;">
            <button id="targetSave">Simpan</button>
            <button id="targetCancel">Batal</button>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    let returnUrl = params.get('returnUrl');

    const video = document.getElementById('video');
    const videoWrap = document.getElementById('videoWrap');
    const toggleBtn = document.getElementById('toggleBtn');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('statusText');
    const ocrHint = document.getElementById('ocrHint');
    const focusRing = document.getElementById('focusRing');
    const torchBtn = document.getElementById('torchBtn');
    const statusBox = document.getElementById('statusBox');
    const manualInput = document.getElementById('manualInput');
    const manualBtn = document.getElementById('manualBtn');

    const targetBox = document.getElementById('targetBox');
    const targetDisplay = document.getElementById('targetDisplay');
    const targetInput = document.getElementById('targetInput');
    const targetActions = document.getElementById('targetActions');
    const targetSave = document.getElementById('targetSave');
    const targetCancel = document.getElementById('targetCancel');

    let mediaStream = null;
    let videoTrack = null;
    let isScanning = false;
    let ocrIntervalId = null;
    let barcodeIntervalId = null;
    let ocrBusy = false;
    let barcodeBusy = false;
    let resultSent = false;
    let torchOn = false;

    function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = 'status-box show status-' + type;
    }
    function hideStatus() { statusBox.className = 'status-box'; }

    function renderTargetDisplay() {
        targetDisplay.textContent = returnUrl ? returnUrl : '(belum diatur — klik untuk isi manual)';
        targetDisplay.style.display = 'block';
        targetInput.style.display = 'none';
        targetActions.style.display = 'none';
    }
    function enterEditMode() {
        targetInput.value = returnUrl || '';
        targetDisplay.style.display = 'none';
        targetInput.style.display = 'block';
        targetActions.style.display = 'flex';
        targetInput.focus();
    }
    targetBox.addEventListener('click', () => { if (targetInput.style.display === 'none') enterEditMode(); });
    targetSave.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = targetInput.value.trim();
        if (val) { returnUrl = val; toggleBtn.disabled = false; manualBtn.disabled = false; hideStatus(); }
        renderTargetDisplay();
    });
    targetCancel.addEventListener('click', (e) => { e.stopPropagation(); renderTargetDisplay(); });

    if (!returnUrl) {
        showStatus('Alamat tujuan belum diatur. Klik kotak "Hasil akan dikirim ke" di bawah untuk mengisinya secara manual.', 'error');
        toggleBtn.disabled = true;
        manualBtn.disabled = true;
    }
    renderTargetDisplay();

    function sendResult(value) {
        if (!returnUrl || resultSent) return;
        resultSent = true;
        const separator = returnUrl.includes('?') ? '&' : '?';
        const finalUrl = returnUrl + separator + 'barcode=' + encodeURIComponent(value);
        showStatus('Kode terbaca: ' + value + ' — mengarahkan kembali...', 'success');
        stopScanning();
        setTimeout(() => { window.location.href = finalUrl; }, 600);
    }

    // ---- TAP TO FOCUS ----
    videoWrap.addEventListener('click', async (e) => {
        if (!isScanning || !videoTrack) return;
        const rect = videoWrap.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        focusRing.style.left = (e.clientX - rect.left) + 'px';
        focusRing.style.top = (e.clientY - rect.top) + 'px';
        focusRing.classList.remove('show');
        void focusRing.offsetWidth;
        focusRing.classList.add('show');

        try {
            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            const advanced = [];
            if (capabilities.pointsOfInterest) {
                advanced.push({ pointsOfInterest: [{ x, y }] });
            }
            if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                advanced.push({ focusMode: 'single-shot' });
            } else if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                advanced.push({ focusMode: 'continuous' });
            }
            if (advanced.length > 0) {
                await videoTrack.applyConstraints({ advanced });
            }
        } catch (err) {
            // device tidak mendukung manual focus control, abaikan saja
        }
    });

    // ---- TORCH / SENTER ----
    torchBtn.addEventListener('click', async () => {
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.classList.toggle('on', torchOn);
        } catch (err) {
            torchOn = !torchOn;
        }
    });

    // ---- BARCODE: zxing-wasm (engine zxing-cpp) ----
    const BARCODE_FORMATS = [
        'Code128', 'Code39', 'Code93', 'Codabar', 'ITF',
        'EAN-13', 'EAN-8', 'UPC-A', 'UPC-E', 'QRCode', 'DataMatrix', 'PDF417'
    ];

    async function runBarcodeTick() {
        if (!isScanning || barcodeBusy || resultSent) return;
        if (!video.videoWidth) return;
        barcodeBusy = true;

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        try {
            const results = await ZXingWASM.readBarcodesFromImageData(imageData, {
                formats: BARCODE_FORMATS,
                tryHarder: true,
                maxNumberOfSymbols: 1,
            });
            if (results && results.length > 0) {
                const text = results[0].text;
                if (text && !resultSent) sendResult(text);
            }
        } catch (e) {}
        barcodeBusy = false;
    }

    // ---- OCR fallback ----
    async function runOcrTick() {
        if (!isScanning || ocrBusy || resultSent) return;
        if (!video.videoWidth) return;
        ocrBusy = true;
        ocrHint.classList.add('show');

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        try {
            const result = await Tesseract.recognize(canvas, 'eng');
            if (resultSent) { ocrBusy = false; return; }
            const rawText = result.data.text;
            const match = rawText.match(/\d{3,5}-\d{1,3}-\d{3,5}/);
            if (match) sendResult(match[0]);
        } catch (e) {}
        ocrHint.classList.remove('show');
        ocrBusy = false;
    }

    async function startScanning() {
        if (!returnUrl) return;
        hideStatus();
        resultSent = false;
        placeholder.style.display = 'none';
        statusText.textContent = 'Memindai...';
        toggleBtn.textContent = 'Hentikan Kamera';
        toggleBtn.classList.add('stop');
        isScanning = true;

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    advanced: [{ focusMode: 'continuous' }]
                }
            });
            video.srcObject = mediaStream;
            await video.play();
            videoTrack = mediaStream.getVideoTracks()[0];

            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            if (capabilities.torch) {
                torchBtn.disabled = false;
            }
        } catch (e) {
            if (e && e.name === 'NotAllowedError') {
                showStatus('Izin kamera ditolak. Pastikan browser diberi izin akses kamera untuk situs ini.', 'error');
            } else {
                showStatus('Gagal mengakses kamera: ' + (e.message || e), 'error');
            }
            stopScanning();
            return;
        }

        barcodeIntervalId = setInterval(runBarcodeTick, 200);
        ocrIntervalId = setInterval(runOcrTick, 2500);
    }

    function stopScanning() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
        video.srcObject = null;
        videoTrack = null;
        torchOn = false;
        torchBtn.classList.remove('on');
        torchBtn.disabled = true;
        if (barcodeIntervalId) { clearInterval(barcodeIntervalId); barcodeIntervalId = null; }
        if (ocrIntervalId) { clearInterval(ocrIntervalId); ocrIntervalId = null; }
        isScanning = false;
        placeholder.style.display = 'flex';
        statusText.textContent = 'Kamera belum aktif';
        ocrHint.classList.remove('show');
        toggleBtn.textContent = 'Mulai Kamera';
        toggleBtn.classList.remove('stop');
    }

    toggleBtn.addEventListener('click', () => {
        if (isScanning) { stopScanning(); } else { startScanning(); }
    });

    manualBtn.addEventListener('click', () => {
        const val = manualInput.value.trim();
        if (!val) return;
        sendResult(val);
    });
    manualInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') manualBtn.click(); });
</script>

</body>
</html>
