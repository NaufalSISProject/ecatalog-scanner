<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Barcode Scanner - E-Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 40px;
    }
    .header { text-align: center; margin-bottom: 20px; max-width: 480px; }
    .header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: #94a3b8; }
    .badge {
        display: inline-block;
        background: #059669;
        color: white;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        margin-bottom: 10px;
        letter-spacing: 0.05em;
    }
    .video-wrap {
        position: relative;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 4 / 3;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        border: 2px solid #334155;
        margin-bottom: 16px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-line {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 50%;
        height: 2px;
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
        animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
        0%, 100% { top: 20%; }
        50% { top: 80%; }
    }
    .mode-indicator {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        gap: 6px;
        justify-content: center;
    }
    .mode-chip {
        background: rgba(15,23,42,0.85);
        border: 1px solid #334155;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 700;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .mode-chip.active { color: #fbbf24; border-color: #92400e; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; }
    .mode-chip.active .dot { background: #fbbf24; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #64748b;
        gap: 8px;
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.5; }
    button {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        border-radius: 14px;
        transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    .btn-main {
        width: 100%;
        max-width: 480px;
        padding: 14px;
        font-size: 0.95rem;
        background: #4f46e5;
        color: white;
        margin-bottom: 20px;
    }
    .btn-main.stop { background: #dc2626; }
    .btn-main:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status-box {
        width: 100%;
        max-width: 480px;
        padding: 14px 16px;
        border-radius: 14px;
        margin-bottom: 20px;
        font-size: 0.85rem;
        display: none;
    }
    .status-box.show { display: block; }
    .status-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .status-success { background: #052e16; border: 1px solid #14532d; color: #86efac; }
    .status-info { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
    .divider {
        width: 100%;
        max-width: 480px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 18px;
        color: #475569;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #334155; }
    .manual-box { width: 100%; max-width: 480px; display: flex; gap: 8px; }
    .manual-box input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        font-size: 0.9rem;
    }
    .manual-box input:focus { outline: 2px solid #4f46e5; }
    .manual-box button {
        padding: 12px 18px;
        background: #1e293b;
        border: 1px solid #334155;
        color: #f1f5f9;
        font-size: 0.9rem;
        white-space: nowrap;
    }

    .target-box {
        width: 100%;
        max-width: 480px;
        margin-top: 20px;
        padding: 12px 14px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        cursor: pointer;
    }
    .target-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 4px;
    }
    .target-display {
        font-size: 0.8rem;
        color: #cbd5e1;
        word-break: break-all;
        font-family: monospace;
    }
    .target-input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #4f46e5;
        background: #0f172a;
        color: #f1f5f9;
        font-size: 0.8rem;
        font-family: monospace;
    }
    .target-actions { display: flex; gap: 8px; margin-top: 8px; }
    .target-actions button {
        padding: 6px 14px;
        font-size: 0.75rem;
        border-radius: 8px;
    }
    #targetSave { background: #4f46e5; color: white; }
    #targetCancel { background: #334155; color: #cbd5e1; }
</style>
</head>
<body>

<div class="header">
    <span class="badge">🔒 HTTPS SECURE</span>
    <h1>Live Barcode Scanner</h1>
    <p>Arahkan kamera ke barcode ATAU tulisan nomor part sparepart. Sistem otomatis membaca keduanya.</p>
</div>

<div class="video-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="mode-indicator" id="modeIndicator" style="display:none;">
        <div class="mode-chip active" id="chipBarcode"><span class="dot"></span>Barcode</div>
        <div class="mode-chip" id="chipOcr"><span class="dot"></span>Teks</div>
    </div>
    <div class="scan-line" id="scanLine" style="display:none;"></div>
    <div class="placeholder" id="placeholder">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9V6a2 2 0 012-2h2M3 15v3a2 2 0 002 2h2m10-16h2a2 2 0 012 2v3m0 6v3a2 2 0 01-2 2h-2M8 12h8"></path></svg>
        <span>Kamera belum aktif</span>
    </div>
</div>

<button class="btn-main" id="toggleBtn">Mulai Kamera</button>

<div class="status-box" id="statusBox"></div>

<div class="divider">Atau</div>

<div class="manual-box">
    <input type="text" id="manualInput" placeholder="Masukkan kode barcode/part manual...">
    <button id="manualBtn">Kirim</button>
</div>

<div class="target-box" id="targetBox">
    <div class="target-label">Hasil akan dikirim ke:</div>
    <div class="target-display" id="targetDisplay"></div>
    <input type="text" class="target-input" id="targetInput" style="display:none;">
    <div class="target-actions" id="targetActions" style="display:none;">
        <button id="targetSave">Simpan</button>
        <button id="targetCancel">Batal</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    let returnUrl = params.get('returnUrl');

    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggleBtn');
    const placeholder = document.getElementById('placeholder');
    const scanLine = document.getElementById('scanLine');
    const modeIndicator = document.getElementById('modeIndicator');
    const chipOcr = document.getElementById('chipOcr');
    const statusBox = document.getElementById('statusBox');
    const manualInput = document.getElementById('manualInput');
    const manualBtn = document.getElementById('manualBtn');

    const targetBox = document.getElementById('targetBox');
    const targetDisplay = document.getElementById('targetDisplay');
    const targetInput = document.getElementById('targetInput');
    const targetActions = document.getElementById('targetActions');
    const targetSave = document.getElementById('targetSave');
    const targetCancel = document.getElementById('targetCancel');

    let codeReader = null;
    let isScanning = false;
    let selectedDeviceId = null;
    let ocrIntervalId = null;
    let ocrBusy = false;
    let resultSent = false;

    function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = 'status-box show status-' + type;
    }
    function hideStatus() { statusBox.className = 'status-box'; }

    function renderTargetDisplay() {
        targetDisplay.textContent = returnUrl ? returnUrl : '(belum diatur — klik untuk isi manual)';
        targetDisplay.style.display = 'block';
        targetInput.style.display = 'none';
        targetActions.style.display = 'none';
    }

    function enterEditMode() {
        targetInput.value = returnUrl || '';
        targetDisplay.style.display = 'none';
        targetInput.style.display = 'block';
        targetActions.style.display = 'flex';
        targetInput.focus();
    }

    targetBox.addEventListener('click', () => {
        if (targetInput.style.display === 'none') enterEditMode();
    });

    targetSave.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = targetInput.value.trim();
        if (val) {
            returnUrl = val;
            toggleBtn.disabled = false;
            manualBtn.disabled = false;
            hideStatus();
        }
        renderTargetDisplay();
    });

    targetCancel.addEventListener('click', (e) => {
        e.stopPropagation();
        renderTargetDisplay();
    });

    if (!returnUrl) {
        showStatus('Alamat tujuan belum diatur. Klik kotak "Hasil akan dikirim ke" di bawah untuk mengisinya secara manual.', 'error');
        toggleBtn.disabled = true;
        manualBtn.disabled = true;
    }
    renderTargetDisplay();

    function sendResult(value) {
        if (!returnUrl || resultSent) return;
        resultSent = true;
        const separator = returnUrl.includes('?') ? '&' : '?';
        const finalUrl = returnUrl + separator + 'barcode=' + encodeURIComponent(value);
        showStatus('Kode terbaca: ' + value + ' — mengarahkan kembali...', 'success');
        stopScanning();
        setTimeout(() => { window.location.href = finalUrl; }, 700);
    }

    async function populateCameras() {
        try {
            const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
            const backCam = devices.find(d => /back|belakang|environment/i.test(d.label));
            selectedDeviceId = backCam ? backCam.deviceId : (devices[0] ? devices[0].deviceId : null);
        } catch (e) {
            showStatus('Tidak bisa mengakses daftar kamera: ' + e.message, 'error');
        }
    }

    async function runOcrTick() {
        if (!isScanning || ocrBusy || resultSent) return;
        if (!video.videoWidth) return;
        ocrBusy = true;
        chipOcr.classList.add('active');

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        try {
            const result = await Tesseract.recognize(canvas, 'eng');
            if (resultSent) { ocrBusy = false; return; }
            const rawText = result.data.text;
            const match = rawText.match(/\d{3,5}-\d{1,3}-\d{3,5}/);
            if (match) {
                sendResult(match[0]);
            }
        } catch (e) {
            // diamkan, dicoba lagi tick berikutnya
        }
        chipOcr.classList.remove('active');
        ocrBusy = false;
    }

    async function startScanning() {
        if (!returnUrl) return;
        hideStatus();
        resultSent = false;
        placeholder.style.display = 'none';
        scanLine.style.display = 'block';
        modeIndicator.style.display = 'flex';
        toggleBtn.textContent = 'Hentikan Kamera';
        toggleBtn.classList.add('stop');
        isScanning = true;

        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.CODE_39,
            ZXing.BarcodeFormat.CODE_93,
            ZXing.BarcodeFormat.ITF,
            ZXing.BarcodeFormat.CODABAR,
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.EAN_8,
            ZXing.BarcodeFormat.UPC_A,
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        codeReader = new ZXing.BrowserMultiFormatReader(hints);

        try {
            await codeReader.decodeFromVideoDevice(selectedDeviceId, video, (result, err) => {
                if (result && !resultSent) {
                    sendResult(result.getText());
                }
            });
        } catch (e) {
            if (e && e.name === 'NotAllowedError') {
                showStatus('Izin kamera ditolak. Pastikan browser diberi izin akses kamera untuk situs ini.', 'error');
            } else {
                showStatus('Gagal mengakses kamera: ' + (e.message || e), 'error');
            }
            stopScanning();
            return;
        }

        ocrIntervalId = setInterval(runOcrTick, 2500);
    }

    function stopScanning() {
        if (codeReader) { try { codeReader.reset(); } catch (e) {} codeReader = null; }
        if (ocrIntervalId) { clearInterval(ocrIntervalId); ocrIntervalId = null; }
        isScanning = false;
        placeholder.style.display = 'flex';
        scanLine.style.display = 'none';
        modeIndicator.style.display = 'none';
        chipOcr.classList.remove('active');
        toggleBtn.textContent = 'Mulai Kamera';
        toggleBtn.classList.remove('stop');
    }

    toggleBtn.addEventListener('click', () => {
        if (isScanning) { stopScanning(); } else { startScanning(); }
    });

    manualBtn.addEventListener('click', () => {
        const val = manualInput.value.trim();
        if (!val) return;
        sendResult(val);
    });

    manualInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') manualBtn.click(); });

    (async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
        } catch (e) {}
        await populateCameras();
    })();
</script>

</body>
</html>
